<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}工业炉保温温度格网交接{% endblock %}</title>
  <style>
    :root { --bd:#d0d7de; --bg:#f6f8fa; --ok:#1a7f37; --err:#cf222e; --accent:#0969da; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
           color:#1f2328; background:#fff; }
    header { background:#24292f; color:#fff; padding:12px 24px; display:flex;
             align-items:center; gap:24px; flex-wrap:wrap; }
    header h1 { font-size:18px; margin:0; }
    header nav a { color:#c9d1d9; text-decoration:none; margin-right:16px; font-size:14px; }
    header nav a:hover { color:#fff; }
    main { padding:24px; max-width:1280px; margin:0 auto; }
    .card { border:1px solid var(--bd); border-radius:8px; padding:16px 20px; margin-bottom:20px;
            background:#fff; }
    .card h2 { margin:0 0 12px; font-size:16px; }
    .flash { padding:10px 14px; border-radius:6px; margin-bottom:12px; font-size:14px; }
    .flash.ok { background:#dafbe1; color:var(--ok); border:1px solid #aceebb; }
    .flash.error { background:#ffebe9; color:var(--err); border:1px solid #ff8182; }
    table { border-collapse:collapse; font-size:12px; }
    td, th { border:1px solid var(--bd); padding:2px 6px; text-align:center; min-width:38px; }
    th { background:var(--bg); position:sticky; top:0; }
    td.empty { background:#f0f0f0; color:#999; }
    td.block-cell { background:#ddf4ff; }
    label { font-size:13px; margin-right:8px; }
    input[type=number], input[type=file], select { padding:6px 8px; border:1px solid var(--bd);
            border-radius:6px; font-size:13px; }
    button { padding:7px 16px; background:var(--accent); color:#fff; border:0; border-radius:6px;
             cursor:pointer; font-size:13px; }
    button.secondary { background:#57606a; }
    button.danger { background:var(--err); }
    .muted { color:#656d76; font-size:12px; }
    .kv { display:inline-block; margin-right:24px; font-size:13px; }
    .kv b { font-size:15px; }
    .scroll { overflow:auto; max-height:560px; border:1px solid var(--bd); border-radius:6px; }
    form.inline { display:inline-block; }
    .row-form { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    .field { display:flex; flex-direction:column; gap:4px; }
    .preview-box { margin-top:14px; padding:12px 14px; border:1px solid #aceebb;
                   border-radius:8px; background:#f6fff8; }
    .preview-box h3 { margin:0 0 8px; font-size:14px; }
    .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
    .tag-ref { background:#fff8c5; border:1px solid #d4a72c; color:#7d5e00; }
    .tag-fill { background:#ddf4ff; border:1px solid #54aeff; color:#0a3069; }
    .ok-text { color:var(--ok); font-size:12px; }
    .err-text { color:var(--err); font-size:12px; font-weight:bold; }
    form.inline button { margin-right:10px; }
  </style>
</head>
<body>
<header>
  <h1>工业炉保温验收 · 温度格网交接</h1>
  <nav>
    <a href="{{ url_for('index') }}">格网总览</a>
    <a href="{{ url_for('blocks_view') }}">现行覆盖块</a>
    <a href="{{ url_for('events') }}">操作记录</a>
    <a href="{{ url_for('download') }}">下载供数 CSV</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
