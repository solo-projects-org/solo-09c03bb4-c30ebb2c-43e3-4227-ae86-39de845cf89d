{% extends "base.html" %}
{% block title %}操作记录 · 温度格网交接{% endblock %}
{% block body %}
<div class="card">
  <h2>操作记录（最近 100 条）</h2>
  <table>
    <tr><th>序号</th><th>时间 (UTC)</th><th>类型</th><th>明细</th></tr>
    {% for r in rows %}
    <tr>
      <td>{{ r.id }}</td><td>{{ r.ts }}</td><td>{{ r.kind }}</td>
      <td style="text-align:left">{{ r.detail }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="muted">暂无记录</td></tr>
    {% endfor %}
  </table>
  <p><a href="{{ url_for('index') }}">返回格网总览</a></p>
</div>
{% endblock %}
