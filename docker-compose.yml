services:
  furnace:
    build: .
    image: furnace-grid:latest
    container_name: furnace-grid
    ports:
      - "8000:8000"
    environment:
      FURNACE_DB: /data/furnace.db
    volumes:
      - furnace-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  furnace-data:
